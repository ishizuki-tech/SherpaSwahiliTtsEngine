name: Build Swahili TTS Engine APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build arm64-v8a debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out build repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install pinned Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Build and verify APK
        env:
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
          PATH: ${{ env.ANDROID_SDK_ROOT }}/cmake/3.22.1/bin:${{ env.PATH }}
        run: ./scripts/build-swahili-tts-apk.sh

      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-swahili-tts-engine-debug-arm64-v8a
          if-no-files-found: error
          path: |
            artifacts/SherpaSwahiliTtsEngine-v1.13.1-arm64-v8a-debug.apk
            artifacts/SherpaSwahiliTtsEngine-v1.13.1-arm64-v8a-debug.apk.sha256
